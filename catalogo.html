<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo • ElectroShop</title>

  <!-- Font Awesome (botón menú, si lo usas) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Estilos globales -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Estilos específicos SOLO para catálogo -->
  <style>
    /* Barra superior (sin cambios) */
    .navbar{
      background:#fff; padding:1rem 2rem; box-shadow:var(--shadow-sm);
      position:sticky; top:0; z-index:10;
    }
    .brand{ font-size:1.5rem; font-weight:700; color:var(--heading-color); text-decoration:none; }
    .menu-toggle{ font-size:1.5rem; color:var(--text-color); cursor:pointer; }

    /* Grid de productos (exactamente como el original) */
    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:1.5rem;
      margin-top:1.5rem;
    }

    /* Tarjeta de producto (igual) */
    .product-card{
      background:#fff;
      border-radius:var(--radius-md);
      padding:1rem;
      box-shadow:var(--shadow-sm);
      display:flex;
      flex-direction:column;
      gap:.75rem;
    }

    /* Nueva miniatura  — mantengo 160 px de alto para que no cambie la altura de la tarjeta */
    .product-card img{
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:var(--radius-md);
    }

    .product-card h3{ font-size:1.2rem; margin:0; }
    .price{ font-weight:600; }

    .actions{
      margin-top:auto;
      display:flex;
      gap:.5rem;
    }
  </style>
</head>
<body>
  <!-- Barra superior -->
  <header class="navbar">
    <a href="#" class="brand">ElectroShop</a>
    <i class="fas fa-bars menu-toggle"></i>
  </header>

  <main class="container">
    <h1>Catálogo</h1>

    <!-- Tarjetas de producto -->
    <section class="product-grid">

      <!-- Producto 1 -->
      <div class="product-card">
        <!-- Miniatura local -->
        <img src="imagenes/Nevera.png" alt="Nevera Samsung RT" />

        <h3>Nevera Samsung RT</h3>
        <p class="price">$1.800.000</p>

        <div class="actions">
          <button class="btn btn-primary"
                  onclick="location.href='carrito.html#'">
            Agregar al carrito
          </button>
          <button class="btn btn-outline"
                  onclick="location.href='detalle.html'">
            Ver más
          </button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="product-card">
        <img src="imagenes/Televisor.png" alt="Televisor LG 55” 4K" />

        <h3>Televisor LG 55” 4K</h3>
        <p class="price">$2.200.000</p>

        <div class="actions">
          <button class="btn btn-primary"
                  onclick="location.href='carrito.html#'">
            Agregar al carrito
          </button>
          <button class="btn btn-outline"
                  onclick="location.href='detalle.html'">
            Ver más
          </button>
        </div>
      </div>

      <!-- Añade más productos replicando la tarjeta -->

    </section>

    <footer style="margin-top:2rem;">
      © 2024 ElectroShop. Todos los derechos reservados.
    </footer>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • ElectroShop</title>

  <!-- Font Awesome para íconos -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Estilos específicos de esta vista -->
  <style>
    body{background:var(--very-light);}
    /* Centrar la tarjeta */
    .login-wrapper{
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .login-card{
      display:flex; width:90%; max-width:1000px; background:#fff; border-radius:var(--radius-md);
      overflow:hidden; box-shadow:var(--shadow-sm);
    }
    .login-img{ flex:1; }
    .login-img img{ width:100%; height:100%; object-fit:cover; display:block; }
    .login-form{ flex:1; padding:2rem; display:flex; flex-direction:column; align-items:center; }
    .login-form h2{ color:var(--primary-blue); margin-bottom:1.5rem; align-self:flex-start; }

    /* Caja blanca interna con cabecera azul claro */
    .form-box{ width:100%; max-width:350px; }
    .btn-google{
      display:block; width:100%; text-align:center; margin-top:1rem;
      background:var(--light-blue); color:var(--primary-blue); border-radius:var(--radius-md);
      padding:.6rem 0; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Imagen de la izquierda -->
      <div class="login-img">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=80"
             alt="Cafe" />
      </div>

      <!-- Formulario de la derecha -->
      <div class="login-form">
        <h2>Login inicio</h2>

        <div class="form-box">
          <div class="card-header">Acceso</div>

          <!-- Usuario -->
          <div style="position:relative;margin:1rem 0;">
            <input type="text" placeholder="Correo o usuario" />
            <i class="fas fa-user" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:#888;"></i>
          </div>

          <!-- Contraseña -->
          <div style="position:relative;margin-bottom:1rem;">
            <input type="password" placeholder="Ingresa tu contraseña" />
            <i class="fas fa-lock" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:#888;"></i>
          </div>

          <!-- Botón iniciar -->
          <button class="btn btn-primary" style="width:100%;"
                  onclick="location.href='catalogo.html'">Iniciar</button>

          <!-- Google -->
          <a class="btn-google" href="#">
            <i class="fab fa-google" style="margin-right:.5rem;"></i>Ingresar con Google
          </a>
        </div>

        <!-- Footer -->
        <footer style="margin-top:2rem;">© 2024 ElectroShop. Todos los derechos reservados.</footer>
      </div>
    </div>
  </div>
</body>
</html>

openapi: 3.0.0
info:
  title: ElectroShop API
  description: API para la plataforma de e-commerce ElectroShop
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Servidor de Desarrollo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
    
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: number
        brand:
          type: string
        images:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1

    Cart:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        updated_at:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              product:
                type: string
              quantity:
                type: integer
              price:
                type: number
        totalAmount:
          type: number
        status:
          type: string
          enum: [pending, paid, delivered, cancelled]
        paymentId:
          type: string
        pickupCode:
          type: string
        qrCodeData:
          type: string

paths:
  # Auth Routes
  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: Usuario registrado exitosamente
        400:
          description: Datos inválidos o usuario ya existe

  /auth/login:
    post:
      summary: Iniciar sesión
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        401:
          description: Credenciales inválidas

  # Product Routes
  /products:
    get:
      summary: Obtener todos los productos
      tags: [Products]
      responses:
        200:
          description: Lista de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
    post:
      summary: Crear un nuevo producto (Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price, description, stock, brand]
              properties:
                name:
                  type: string
                price:
                  type: number
                description:
                  type: string
                stock:
                  type: number
                brand:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        201:
          description: Producto creado
        403:
          description: No autorizado (Requiere rol Admin)

  /products/{id}:
    get:
      summary: Obtener un producto por ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Detalles del producto
        404:
          description: Producto no encontrado
    put:
      summary: Actualizar un producto (Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                description:
                  type: string
                stock:
                  type: number
      responses:
        200:
          description: Producto actualizado
    delete:
      summary: Eliminar un producto (Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Producto eliminado

  # Cart Routes
  /cart:
    get:
      summary: Obtener el carrito del usuario actual
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Carrito del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Cart'
    post:
      summary: Agregar producto al carrito
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        200:
          description: Producto agregado
    delete:
      summary: Vaciar el carrito
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Carrito vaciado

  /cart/{productId}:
    put:
      summary: Actualizar cantidad de un producto en el carrito
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
      responses:
        200:
          description: Cantidad actualizada
    delete:
      summary: Eliminar un producto del carrito
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Producto eliminado del carrito

  # Order Routes
  /orders/checkout:
    post:
      summary: Iniciar proceso de checkout (MercadoPago)
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        200:
          description: URL de pago generada
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string

  /orders/finalize:
    post:
      summary: Finalizar orden después del pago
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                  description: ID de pago o sesión de MercadoPago
      responses:
        200:
          description: Orden creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'

  /orders/my-orders:
    get:
      summary: Obtener historial de órdenes del usuario
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

  /orders/all:
    get:
      summary: Obtener todas las órdenes (Admin)
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista completa de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        403:
          description: No autorizado (Requiere rol Admin)
